name: Deploy Android to Google Play Internal

on:
  workflow_dispatch: # Permette di avviare l'azione manualmente da GitHub
  push:
    tags:
      - 'v*' # Si avvia automaticamente quando si crea un tag (es. v1.0.0)

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Install Fastlane
        run: gem install fastlane

      - name: Prepare Android Keystore and Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          # Ricrea il file keystore.jks dal Base64 ignorando ritorni a capo Windows
          echo "$KEYSTORE_BASE64" | base64 -d -i > app/keystore.jks
          # Ricrea il file keystore.properties senza spaziature
          echo "storePassword=$KEYSTORE_PASSWORD" > keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "storeFile=app/keystore.jks" >> keystore.properties



      - name: Run Fastlane Deploy
        env:
          PLAY_CONFIG_JSON_PATH: "fastlane/play_config.json"
        run: |
          cd android
          chmod +x gradlew
          fastlane deploy_internal
