name: 🚀 Deploy OmniDex su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permette avvio manuale dalla UI di GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Impedisce deploy multipli in parallelo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout codice
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installa dipendenze
        run: npm ci

      - name: 🔨 Build produzione
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_RAWG_API_KEY: ${{ secrets.VITE_RAWG_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: ⚙️ Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload artefatto build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🌍 Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
